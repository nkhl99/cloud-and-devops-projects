apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app-deployment
  annotations:
    description: "My flask app"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
      - name: flask-app-cicd
        image: nikhil230/ci-cd:2
        ports:
        - containerPort: 5000
